<!DOCTYPE html>
  // OLVIDE Q TENIA DOS VERSIONES XD
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla Periódica Interactiva Full + Laboratorio</title>
    <style>
        /* --- RESET Y VARIABLES --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 20px 0;
        }

        h1 {
            margin-bottom: 20px;
            color: #58a6ff;
            text-shadow: 0 0 10px rgba(88, 166, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* --- CONTENEDOR DE LA GRILLA --- */
        #table-container {
            display: grid;
            grid-template-columns: repeat(18, 55px);
            grid-template-rows: repeat(10, 55px);
            gap: 6px;
            position: relative;
            margin-bottom: 30px;
        }

        /* --- ESTILOS DE CADA ELEMENTO --- */
        .element {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 6px;
            cursor: grab;
            transition: all 0.2s ease-out;
            background: rgba(22, 27, 34, 0.8);
            border: 1px solid #30363d;
            position: relative;
            user-select: none; /* Pa q no se pinte el texto al arrastrar */
        }

        .element:active {
            cursor: grabbing;
        }

        .element .number {
            font-size: 10px;
            position: absolute;
            top: 4px;
            left: 6px;
            color: #8b949e;
        }

        .element .symbol {
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            pointer-events: none;
        }

        .element:hover {
            transform: scale(1.3);
            z-index: 10;
            box-shadow: 0 0 15px currentColor;
            border-color: currentColor;
        }

        /* Paleta de colores */
        .nonmetal { color: #58a6ff; }
        .noble { color: #a371f7; }
        .alkali { color: #ff7b72; }
        .alkaline { color: #d2a8ff; }
        .metalloid { color: #3fb950; }
        .halogen { color: #f2cc60; }
        .metal { color: #e3b341; }
        .transition { color: #ff9900; }
        .lanthanide { color: #ff66b2; } 
        .actinide { color: #ff3333; } 

        /* --- PANEL DE INFO HOVER --- */
        #info-panel {
            position: absolute;
            top: 10px;
            left: 190px;
            width: 380px;
            height: 140px;
            background: rgba(13, 17, 23, 0.9);
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            opacity: 0.5;
            transition: opacity 0.3s ease;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            pointer-events: none;
            z-index: 5;
        }

        #info-panel.active {
            opacity: 1;
            border-color: var(--active-color, #58a6ff);
            box-shadow: 0 0 20px var(--active-color, #58a6ff);
        }

        #info-symbol { font-size: 50px; font-weight: bold; min-width: 70px; text-align: center; }
        .info-details h2 { font-size: 20px; margin-bottom: 5px; color: #fff; }
        .info-details p { font-size: 13px; color: #8b949e; margin-bottom: 3px; }

        /* --- ZONA DEL REACTOR (DRAG & DROP) --- */
        #lab-section {
            width: 100%;
            max-width: 1020px;
            background: #161b22;
            border: 2px dashed #30363d;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        #lab-section h2 { color: #3fb950; text-transform: uppercase; font-size: 18px; }

        .reactor-slots {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .slot {
            width: 80px;
            height: 80px;
            border: 2px dashed #8b949e;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            background: rgba(0,0,0,0.3);
            transition: 0.3s;
        }

        .slot.dragover {
            background: rgba(88, 166, 255, 0.2);
            border-color: #58a6ff;
            transform: scale(1.1);
        }

        .plus-sign { font-size: 30px; color: #8b949e; font-weight: bold; }

        #reaction-output {
            margin-top: 10px;
            min-height: 40px;
            padding: 10px 20px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            width: 80%;
        }

        #btn-clear {
            background: #ff7b72;
            color: #0d1117;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            display: none; /* Se oculta hasta q haya mezcla */
        }
        #btn-clear:hover { background: #ff3333; }

    </style>
</head>

            uiWeight.textContent = `Peso Atómico: ${el.mass}`;
            uiCat.textContent = `Categoría: ${categoryNames[el.cat] || el.cat}`;
        });

        div.addEventListener('mouseleave', () => {
            panel.classList.remove('active');
            uiSymbol.style.color = '#c9d1d9';
        });

        // Evento Drag Start (Inicia el arrastre)
        div.addEventListener('dragstart', (e) => {
            e.dataTransfer.setData('text/plain', el.sym); // Mandamos el simbolo en el paquete
            e.dataTransfer.effectAllowed = 'copy';
        });

        container.appendChild(div);

        slot.addEventListener('dragleave', () => slot.classList.remove('dragover'));

        slot.addEventListener('drop', (e) => {
            e.preventDefault();
            slot.classList.remove('dragover');
            
            const droppedSymbol = e.dataTransfer.getData('text/plain');
            if (droppedSymbol) {
                // Sacar color pa pintarlo bacan en el slot
                const elData = elementsData.find(el => el.sym === droppedSymbol);
                const colorCat = getComputedStyle(document.querySelector(`.${elData.cat}`)).color;
                
                slot.textContent = droppedSymbol;
                slot.style.color = colorCat;
                slot.style.borderColor = colorCat;
                
                reactorSlots[index] = droppedSymbol;
                checkReaction();
            }
        });
    });

    // Boton de limpiar
    btnClear.addEventListener('click', () => {
        reactorSlots = [null, null];
        slotElements.forEach((s, i) => {
            s.textContent = i + 1;
            s.style.color = '#8b949e';
            s.style.borderColor = '#8b949e';
        });
        output.innerHTML = 'Esperando elementos...';
        btnClear.style.display = 'none';
    });

    // Funcion maestra q verifica que pasa al mezclar
    function checkReaction() {
        if (!reactorSlots[0] || !reactorSlots[1]) return; // Si falta 1, nada.

        btnClear.style.display = 'inline-block';
        const sym1 = reactorSlots[0];
        const sym2 = reactorSlots[1];

        // Ordenamos alfabeticamente para q H+O sea igual q O+H
        const pair = [sym1, sym2].sort().join('-');

        // TODO: Base de datos chiquita de compuestos reales (meter más luego)
        const specificReactions = {
            'H-O': '<strong>Agua (H₂O):</strong> 💧 El líquido vital, causa. (Necesitas 2H y 1O, pero aquí asumimos las proporciones correctas).',
            'Cl-Na': '<strong>Cloruro de Sodio (NaCl):</strong> 🧂 Sal de mesa para las papas fritas.',
            'C-O': '<strong>Dióxido de Carbono (CO₂):</strong> 💨 Gas de efecto invernadero (Lo que exhalas).',
            'Cl-H': '<strong>Ácido Clorhídrico (HCl):</strong> 🧪 Ácido recontra corrosivo, está en tu estómago.',
            'Fe-O': '<strong>Óxido de Hierro (Fe₂O₃):</strong> 🟤 Fierro oxidado. Lo que le pasa a tu bici si la dejas afuera.',
            'H-N': '<strong>Amoníaco (NH₃):</strong> 🤢 Huele fuerte, usado en limpiadores y fertilizantes.',
            'C-H': '<strong>Metano (CH₄):</strong> 🔥 Gas natural. Cuidado que explota.',
            'F-U': '<strong>Hexafluoruro de Uranio (UF₆):</strong> ☢️ Compuesto usado pa enriquecer uranio.',
            'C-Fe': '<strong>Acero (Aleación):</strong> ⚔️ Hierro + un toque de Carbono = Acero. Recontra duro.',
            'C-N': '<strong>Cianuro (CN⁻):</strong> ☠️ Toxina letal. Ni lo mires.',
            'Au-Cl': '<strong>Cloruro de Oro (AuCl₃):</strong> ✨ Sal de oro que se disuelve en agua.'
        };

        // Si es el mismo elemento dos veces
        if (sym1 === sym2) {
            if (['H', 'N', 'O', 'F', 'Cl', 'Br', 'I'].includes(sym1)) {
                output.innerHTML = `<strong>Molécula Diatómica (${sym1}₂):</strong> 🌬️ Así existe este elemento naturalmente en forma de gas.`;
            } else {
                output.innerHTML = `<strong>Bloque sólido de ${sym1}:</strong> 🧱 Solo es más cantidad del mismo elemento puro.`;
            }
            return;
        }

        // Si la pareja exacta existe en nuestro diccionario:
        if (specificReactions[pair]) {
            output.innerHTML = specificReactions[pair];
            return;
        }

        // Si no está hardcodeado, tiramos lógica basada en familias químicas
        const el1 = elementsData.find(e => e.sym === sym1);
        const el2 = elementsData.find(e => e.sym === sym2);

        // Gases nobles no se juntan ni de chiste
        if (el1.cat === 'noble' || el2.cat === 'noble') {
            output.innerHTML = '<strong>No hay reacción:</strong> 😴 Uno de ellos es un gas noble. Tienen su capa de valencia llena y son recontra asociales.';
            return;
        }

        // Alcalino + Halógeno = Sal iónica explosiva
        if ((el1.cat === 'alkali' && el2.cat === 'halogen') || (el2.cat === 'alkali' && el1.cat === 'halogen')) {
            output.innerHTML = '<strong>Sal Iónica violenta:</strong> 💥 El metal alcalino le tira un electrón al halógeno de forma violenta. ¡Boom!';
            return;
        }

        // Metal + Metal = Aleación
        const metales = ['alkali', 'alkaline', 'transition', 'metal', 'lanthanide', 'actinide'];
        if (metales.includes(el1.cat) && metales.includes(el2.cat)) {
            output.innerHTML = '<strong>Aleación Metálica:</strong> ⚙️ Se funden formando una red metálica. Comparten electrones como una "sopa".';
            return;
        }

        // No Metal + No Metal = Enlace covalente
        if (el1.cat === 'nonmetal' && el2.cat === 'nonmetal') {
            output.innerHTML = '<strong>Compuesto Covalente:</strong> 🤝 Ninguno quiere soltar electrones, así que los comparten.';
            return;
        }

        // Metal + No Metal = Compuesto Iónico (genérico)
        if ((metales.includes(el1.cat) && el2.cat === 'nonmetal') || (el1.cat === 'nonmetal' && metales.includes(el2.cat))) {
            output.innerHTML = '<strong>Compuesto Iónico:</strong> 🔋 El metal pierde electrones y se oxida; el no metal los gana. Se unen por atracción eléctrica.';
            return;
        }

        output.innerHTML = 'Mezcla genérica. Faltan datos en la base para simular esta reacción específica.';
    }

</script>
