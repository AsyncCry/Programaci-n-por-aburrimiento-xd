<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla Periódica Interactiva</title>
    <style>
        /* --- RESET Y VARIABLES --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1 {
            margin-bottom: 30px;
            color: #58a6ff;
            text-shadow: 0 0 10px rgba(88, 166, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* --- CONTENEDOR DE LA GRILLA (Magia de CSS Grid) --- */
        #table-container {
            display: grid;
            grid-template-columns: repeat(18, 60px);
            grid-template-rows: repeat(7, 60px);
            gap: 6px;
            position: relative;
        }

        /* --- ESTILOS DE CADA ELEMENTO --- */
        .element {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            background: rgba(22, 27, 34, 0.8);
            border: 1px solid #30363d;
            position: relative;
        }

        .element .number {
            font-size: 10px;
            position: absolute;
            top: 4px;
            left: 6px;
            color: #8b949e;
        }

        .element .symbol {
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
        }

        /* Animacion de hover recontra smooth */
        .element:hover {
            transform: scale(1.4);
            z-index: 10;
            box-shadow: 0 0 15px currentColor;
            border-color: currentColor;
        }

        /* Colores por categoria (usando variables locales en JS) */
        .nonmetal { color: #58a6ff; }
        .noble { color: #a371f7; }
        .alkali { color: #ff7b72; }
        .alkaline { color: #d2a8ff; }
        .metalloid { color: #3fb950; }
        .halogen { color: #f2cc60; }
        .metal { color: #e3b341; }
        .transition { color: #ff9900; }

        /* --- PANEL DE INFO CENTRAL --- */
        #info-panel {
            position: absolute;
            top: 10px;
            left: 200px;
            width: 400px;
            height: 150px;
            background: rgba(13, 17, 23, 0.9);
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            opacity: 0.5;
            transition: opacity 0.3s ease;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            pointer-events: none; /* Pa que no estorbe los clics */
        }

        #info-panel.active {
            opacity: 1;
            border-color: var(--active-color, #58a6ff);
            box-shadow: 0 0 20px var(--active-color, #58a6ff);
        }

        #info-symbol {
            font-size: 60px;
            font-weight: bold;
            min-width: 80px;
            text-align: center;
        }

        .info-details h2 { font-size: 24px; margin-bottom: 5px; color: #fff; }
        .info-details p { font-size: 14px; color: #8b949e; margin-bottom: 3px; }
    </style>
</head>
<body>

    <h1>Tabla Periódica</h1>

    <div id="table-container">
        <!-- El panel central flotante -->
        <div id="info-panel">
            <div id="info-symbol">?</div>
            <div class="info-details">
                <h2 id="info-name">Pasa el mouse</h2>
                <p id="info-number">No. Atómico: --</p>
                <p id="info-weight">Peso Atómico: --</p>
                <p id="info-cat">Categoría: --</p>
            </div>
        </div>
    </div>

<script>
    // Data de los elementos. 
    // TODO: Llenar los 118 despues (o conectar a una API externa pa no hardcodear tanto).
    // Por ahora meti hasta el Kripton (Z=36) pa armar la estructura.
    const elementsData = [
        { z: 1, sym: 'H', name: 'Hidrógeno', mass: 1.008, cat: 'nonmetal', col: 1, row: 1 },
        { z: 2, sym: 'He', name: 'Helio', mass: 4.0026, cat: 'noble', col: 18, row: 1 },
        
        { z: 3, sym: 'Li', name: 'Litio', mass: 6.94, cat: 'alkali', col: 1, row: 2 },
        { z: 4, sym: 'Be', name: 'Berilio', mass: 9.0122, cat: 'alkaline', col: 2, row: 2 },
        { z: 5, sym: 'B', name: 'Boro', mass: 10.81, cat: 'metalloid', col: 13, row: 2 },
        { z: 6, sym: 'C', name: 'Carbono', mass: 12.011, cat: 'nonmetal', col: 14, row: 2 },
        { z: 7, sym: 'N', name: 'Nitrógeno', mass: 14.007, cat: 'nonmetal', col: 15, row: 2 },
        { z: 8, sym: 'O', name: 'Oxígeno', mass: 15.999, cat: 'nonmetal', col: 16, row: 2 },
        { z: 9, sym: 'F', name: 'Flúor', mass: 18.998, cat: 'halogen', col: 17, row: 2 },
        { z: 10, sym: 'Ne', name: 'Neón', mass: 20.180, cat: 'noble', col: 18, row: 2 },

        { z: 11, sym: 'Na', name: 'Sodio', mass: 22.990, cat: 'alkali', col: 1, row: 3 },
        { z: 12, sym: 'Mg', name: 'Magnesio', mass: 24.305, cat: 'alkaline', col: 2, row: 3 },
        { z: 13, sym: 'Al', name: 'Aluminio', mass: 26.982, cat: 'metal', col: 13, row: 3 },
        { z: 14, sym: 'Si', name: 'Silicio', mass: 28.085, cat: 'metalloid', col: 14, row: 3 },
        { z: 15, sym: 'P', name: 'Fósforo', mass: 30.974, cat: 'nonmetal', col: 15, row: 3 },
        { z: 16, sym: 'S', name: 'Azufre', mass: 32.06, cat: 'nonmetal', col: 16, row: 3 },
        { z: 17, sym: 'Cl', name: 'Cloro', mass: 35.45, cat: 'halogen', col: 17, row: 3 },
        { z: 18, sym: 'Ar', name: 'Argón', mass: 39.95, cat: 'noble', col: 18, row: 3 },

        // Fila 4 (Empiezan los de transicion)
        { z: 19, sym: 'K', name: 'Potasio', mass: 39.098, cat: 'alkali', col: 1, row: 4 },
        { z: 20, sym: 'Ca', name: 'Calcio', mass: 40.078, cat: 'alkaline', col: 2, row: 4 },
        { z: 21, sym: 'Sc', name: 'Escandio', mass: 44.956, cat: 'transition', col: 3, row: 4 },
        { z: 22, sym: 'Ti', name: 'Titanio', mass: 47.867, cat: 'transition', col: 4, row: 4 },
        { z: 23, sym: 'V', name: 'Vanadio', mass: 50.942, cat: 'transition', col: 5, row: 4 },
        { z: 24, sym: 'Cr', name: 'Cromo', mass: 51.996, cat: 'transition', col: 6, row: 4 },
        { z: 25, sym: 'Mn', name: 'Manganeso', mass: 54.938, cat: 'transition', col: 7, row: 4 },
        { z: 26, sym: 'Fe', name: 'Hierro', mass: 55.845, cat: 'transition', col: 8, row: 4 },
        { z: 27, sym: 'Co', name: 'Cobalto', mass: 58.933, cat: 'transition', col: 9, row: 4 },
        { z: 28, sym: 'Ni', name: 'Níquel', mass: 58.693, cat: 'transition', col: 10, row: 4 },
        { z: 29, sym: 'Cu', name: 'Cobre', mass: 63.546, cat: 'transition', col: 11, row: 4 },
        { z: 30, sym: 'Zn', name: 'Zinc', mass: 65.38, cat: 'transition', col: 12, row: 4 },
        { z: 31, sym: 'Ga', name: 'Galio', mass: 69.723, cat: 'metal', col: 13, row: 4 },
        { z: 32, sym: 'Ge', name: 'Germanio', mass: 72.630, cat: 'metalloid', col: 14, row: 4 },
        { z: 33, sym: 'As', name: 'Arsénico', mass: 74.922, cat: 'metalloid', col: 15, row: 4 },
        { z: 34, sym: 'Se', name: 'Selenio', mass: 78.971, cat: 'nonmetal', col: 16, row: 4 },
        { z: 35, sym: 'Br', name: 'Bromo', mass: 79.904, cat: 'halogen', col: 17, row: 4 },
        { z: 36, sym: 'Kr', name: 'Kriptón', mass: 83.798, cat: 'noble', col: 18, row: 4 }
    ];

    const container = document.getElementById('table-container');
    const panel = document.getElementById('info-panel');
    
    // Nodos del panel de info
    const uiSymbol = document.getElementById('info-symbol');
    const uiName = document.getElementById('info-name');
    const uiNumber = document.getElementById('info-number');
    const uiWeight = document.getElementById('info-weight');
    const uiCat = document.getElementById('info-cat');

    // Renderizar la grilla dinamicamente
    elementsData.forEach(el => {
        const div = document.createElement('div');
        div.classList.add('element', el.cat);
        
        // CSS Grid positioning magico
        div.style.gridColumn = el.col;
        div.style.gridRow = el.row;

        div.innerHTML = `
            <span class="number">${el.z}</span>
            <span class="symbol">${el.sym}</span>
        `;

        // Eventos pa' que brille y cambie el panel cuando pasas el mouse
        div.addEventListener('mouseenter', () => {
            // Sacar el color computado para meterlo al panel
            const color = window.getComputedStyle(div).color;
            
            panel.classList.add('active');
            panel.style.setProperty('--active-color', color);
            
            uiSymbol.textContent = el.sym;
            uiSymbol.style.color = color;
            uiName.textContent = el.name;
            uiNumber.textContent = `No. Atómico: ${el.z}`;
            uiWeight.textContent = `Peso Atómico: ${el.mass}`;
            
            // Capitalizar la categoria
            uiCat.textContent = `Categoría: ${el.cat.charAt(0).toUpperCase() + el.cat.slice(1)}`;
        });

        div.addEventListener('mouseleave', () => {
            panel.classList.remove('active');
            uiSymbol.style.color = '#c9d1d9';
        });

        container.appendChild(div);
    });

</script>
</body>
</html>
