<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Yarelli</title>
    <style>
        body {
            background-color: #ffeef2;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 80%;
            max-width: 500px;
        }

        h1 {
            color: #d11d53;
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        p {
            color: #555;
            font-size: 1.2em;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* --- UI COMPONENT: FLOWER --- */
        .flower {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 30px;
        }

        .petal {
            position: absolute;
            background-color: #ff69b4;
            border-radius: 50% 50% 0 0;
            opacity: 0.8;
            transform-origin: bottom center;
            width: 30px;
            height: 50px;
        }

        /* Rotacion de petalos (Matriz de 360deg / 8) */
        .p1 { transform: translateX(35px) rotate(0deg); }
        .p2 { transform: translateX(35px) rotate(45deg); }
        .p3 { transform: translateX(35px) rotate(90deg); }
        .p4 { transform: translateX(35px) rotate(135deg); }
        .p5 { transform: translateX(35px) rotate(180deg); }
        .p6 { transform: translateX(35px) rotate(225deg); }
        .p7 { transform: translateX(35px) rotate(270deg); }
        .p8 { transform: translateX(35px) rotate(315deg); }

        .center {
            position: absolute;
            width: 30px;
            height: 30px;
            background-color: #ffd700;
            border-radius: 50%;
            top: 35px;
            left: 35px;
            z-index: 10;
        }

        .stem {
            position: absolute;
            width: 5px;
            height: 80px;
            background-color: #228b22;
            top: 75px;
            left: 47.5px;
            border-radius: 2px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Para Yarelli</h1>

    <!-- Render de la flor en CSS puro -->
    <div class="flower">
        <div class="petal p1"></div>
        <div class="petal p2"></div>
        <div class="petal p3"></div>
        <div class="petal p4"></div>
        <div class="petal p5"></div>
        <div class="petal p6"></div>
        <div class="petal p7"></div>
        <div class="petal p8"></div>
        <div class="center"></div>
        <div class="stem"></div>
    </div>

    <p>
        A veces, las palabras no son suficientes para expresar lo que el corazón siente. Esta flor es un pequeño recordatorio de que, aunque los caminos se separen, el cariño y los buenos recuerdos permanecen. Gracias por los momentos compartidos.
    </p>
</div>

</body>
</html>
